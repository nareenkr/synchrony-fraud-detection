[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "synchrony-fraud-platform"
version = "0.1.0"
description = "Real-time hybrid fraud decisioning prototype for digital lending"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.10,<3",
  "pandas>=2.2,<3",
  "numpy>=2,<3",
  "scikit-learn>=1.6,<2",
  "xgboost>=2.1,<4",
  "shap>=0.46,<1",
  "matplotlib>=3.9,<4",
  "SQLAlchemy>=2.0,<3",
  "PyYAML>=6,<7",
  "joblib>=1.4,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]
postgres = ["psycopg[binary]>=3.2,<4"]
redis = ["redis>=5.2,<7"]

[tool.setuptools.packages.find]
include = ["backend*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
